# Local development overrides — merged automatically by `docker compose up`.
# Not used by other containers (they reach Postgres over the internal
# Docker network as our-postgres:5432); this is only for connecting from
# host tools like psql/DBeaver while developing.

services:
  our-postgres:
    ports:
      - "5432:5432"

  vehicle-service:
    ports:
      - "5002:5002"

  search-service:
    ports:
      - "5001:5001"

  chat-service:
    ports:
      - "5000:5000"
