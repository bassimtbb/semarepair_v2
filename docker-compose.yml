services:
  our-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build: ./services/ingestion
    restart: "no"
    environment:
      OUR_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@our-postgres:5432/${POSTGRES_DB}
      EXCEL_PATH: /app/Data/GUP_PER_IA.xlsx
    volumes:
      - ./Data:/app/Data:ro
    depends_on:
      our-postgres:
        condition: service_healthy

  ingestion-resx:
    build: ./services/ingestion-resx
    restart: "no"
    environment:
      OUR_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@our-postgres:5432/${POSTGRES_DB}
      RESX_PATH: /app/Data/resx_samples
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PRICING_PATH: /app/Config/gemini-pricing.json
    volumes:
      - ./Data:/app/Data:ro
      - ./config:/app/Config:ro
    depends_on:
      our-postgres:
        condition: service_healthy
      ingestion:
        condition: service_completed_successfully

  # OCR du manuel scanne. Sous un profil : ne demarre jamais avec la stack,
  # se lance a la demande par
  #     docker compose --profile ocr run --rm ocr-manual
  # C'est un travail ponctuel qui ecrit Data/MANUAL/ocr.json, pas un service.
  ocr-manual:
    build: ./services/ocr-manual
    restart: "no"
    profiles: ["ocr"]
    environment:
      MANUAL_PATH: /app/Data/MANUAL
      OCR_LANG: ita
    # En ecriture, contrairement aux autres montages de Data : ce conteneur
    # produit ocr.json.
    volumes:
      - ./Data:/app/Data

  vehicle-service:
    build: ./services/vehicle
    restart: unless-stopped
    environment:
      OUR_DB: Host=our-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      our-postgres:
        condition: service_healthy
      ingestion:
        condition: service_completed_successfully

  search-service:
    build: ./services/search
    restart: unless-stopped
    environment:
      OUR_DB: Host=our-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PRICING_PATH: /app/Config/gemini-pricing.json
      SEMAREPAIR_ASSETS_PATH: /app/Assets
    volumes:
      - ./config:/app/Config:ro
      # Read-only, and read for ONE purpose: the coverage endpoint suggests
      # questions whose answer carries a picture, and it can only honestly do
      # that if it knows which pictures were actually delivered. 212 assets
      # are referenced by the documents and were never sent, so "has an
      # asset_id" is not the same question as "has an image to show".
      #
      # nginx serves these same directories; this service only lists them.
      - ./Data/photos:/app/Assets/photos:ro
      - ./Data/PDF:/app/Assets/pdf:ro
    depends_on:
      our-postgres:
        condition: service_healthy
      ingestion-resx:
        condition: service_completed_successfully

  chat-service:
    build: ./services/chat
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLOUD_TTS_API_KEY: ${GOOGLE_CLOUD_TTS_API_KEY}
      SEARCH_SERVICE_URL: http://search-service:5001
      VEHICLE_SERVICE_URL: http://vehicle-service:5002
      GEMINI_PRICING_PATH: /app/Config/gemini-pricing.json
      OUR_DB: Host=our-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Extension v2 (docs/Architecture_Extension_v2.md section 6). Off means
      # the SearchTechnicalInfo tool is not declared to Gemini and its routing
      # rule is not injected, so behaviour is byte-identical to before the
      # extension existed. Flipping it back and restarting this one container
      # is the escape hatch if routing degrades before a demo.
      TECHNICAL_INFO_ENABLED: ${TECHNICAL_INFO_ENABLED:-false}
    volumes:
      - ./config:/app/Config:ro
    depends_on:
      our-postgres:
        condition: service_healthy
      search-service:
        condition: service_started
      vehicle-service:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # 9080 on the host, 80 inside the container.
    #
    # The host port is 9080 because forj-dkr-dev-01 is shared: port 80 is a
    # single resource on that machine, and taking it would deny it to every
    # other container for good. Their infrastructure team keeps 8084-9100 open
    # and asked us to pick one. 9080 sits mid-range - away from the crowded
    # 808x band where the next container is likeliest to land - and is not the
    # default of any common service (8080 Tomcat, 8086 InfluxDB, 8090
    # Confluence, 9000 Portainer, 9090 Prometheus).
    #
    # Nothing inside the stack moves: nginx still listens on 80 in its own
    # network namespace, and the service-to-service URLs are unchanged. Only
    # the published port differs, so IIS proxies to 172.16.40.151:9080.
    ports:
      - "9080:80"
    environment:
      USAGE_DASHBOARD_KEY: ${USAGE_DASHBOARD_KEY}
    # Mounted into /templates (not /conf.d) so the official nginx image's
    # entrypoint runs envsubst over it at startup, substituting
    # ${USAGE_DASHBOARD_KEY} with the real secret before nginx loads it -
    # see docs/log-dashboard.md section 8 (the usage dashboard's
    # shared-secret guard). nginx.conf itself is unchanged on disk; only
    # the mount target/mechanism changed.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # Extension v2: the 7 wiring-diagram PDFs, served straight by nginx.
      # Read-only, and no service reads them - they are static files, which
      # is exactly what nginx is for.
      - ./Data/PDF:/usr/share/semarepair/pdf:ro
      # Les 89 pages du manuel scanne, servies telles quelles.
      - ./Data/MANUAL:/usr/share/semarepair/manual:ro
      # Les photos de composants citees par les documents.
      - ./Data/photos:/usr/share/semarepair/photos:ro
    depends_on:
      - chat-service
      - search-service
      - vehicle-service
      - frontend
