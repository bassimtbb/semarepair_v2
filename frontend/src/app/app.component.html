<div class="app-shell bg-background" [class.app-shell--drawer-open]="help.isOpen()">
  <header class="app-header bg-background border-border">
    <img class="brand-logo" src="SemaRepairLogo.png" alt="SemaRepair" />

    <div class="header-center">
      @if (chat.confirmedCar(); as car) {
        <div class="confirmed-car bg-surface border-border">
          <button
            type="button"
            class="close-badge bg-background border-border text-muted hover:bg-foreground/8"
            (click)="chat.reset()"
            title="Reset"
            aria-label="Reset veicolo confermato"
          >
            <svg lucideX [size]="10"></svg>
          </button>
          <span class="car-name text-accent">{{ car.marca }} {{ car.modello }}</span>
          <span class="car-details text-muted">{{ carDetails(car) }}</span>
        </div>
      }
    </div>

    <div class="header-actions">
      <!-- The usage-dashboard link was removed from the header: it shows real
           spend, and this page is about to be handed to a client. The page
           itself still exists and is still routed at /usage, reachable by
           typing the URL - nothing was deleted, only taken off the bar. -->

      <a
        class="nav-link border-border text-foreground hover:bg-foreground/8"
        routerLink="/"
        title="Torna alla chat"
        aria-label="Torna alla chat"
      >
        <svg lucideMessageCircle [size]="18"></svg>
      </a>

      <!-- Brings the help drawer back after the first visit opened it once
           by itself. The drawer lives on the chat page; this only flips the
           shared signal, so the header needs to know nothing about it. -->
      <button
        type="button"
        class="theme-toggle border-border text-foreground hover:bg-foreground/8"
        (click)="help.toggle()"
        [title]="helpStrings().title"
        [attr.aria-label]="helpStrings().title"
        [attr.aria-expanded]="help.isOpen()"
      >
        <svg lucideCircleHelp [size]="18"></svg>
      </button>

      <button
        type="button"
        class="theme-toggle border-border text-foreground hover:bg-foreground/8"
        (click)="theme.toggle()"
        [title]="theme.isDark() ? 'Passa al tema chiaro' : 'Passa al tema scuro'"
      >
        @if (theme.isDark()) {
          <svg lucideSun [size]="18"></svg>
        } @else {
          <svg lucideMoon [size]="18"></svg>
        }
      </button>
    </div>
  </header>

  <router-outlet />
</div>
