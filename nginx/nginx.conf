# API Gateway routing — see docs/SemaRepair_Architecture.md section 6.7.

server {
    listen 80;

    # Docker's embedded DNS. Paired with the variable proxy_pass targets
    # below, this makes nginx re-resolve each backend hostname per request
    # (short TTL) instead of caching the IP once at startup. Without this, a
    # recreated backend container (new IP) returns 502 until nginx itself is
    # restarted — reproduced live in two prior sessions (H4).
    resolver 127.0.0.11 valid=10s;

    # NOTE (H4): a variable in proxy_pass forces per-request name resolution,
    # but it also stops nginx from auto-appending the request URI the way a
    # static proxy_pass does — so $request_uri (full original path + query) is
    # appended explicitly on every route. Omitting it would silently route
    # every request to "/". The $upstream_* vars and $request_uri are NOT
    # container env vars, so the image's envsubst step leaves them untouched
    # (it only substitutes ${USAGE_DASHBOARD_KEY}); the pre-existing
    # $http_x_usage_key below already relied on this and worked.

    # Regex (not plain prefix) so that e.g. "/api/vehicles" (no trailing
    # slash - the bare vehicle-list route) matches directly instead of
    # 301-redirecting to add a slash, while "/api/vehiclesXYZ" still
    # correctly falls through to the catch-all below.
    location ~ ^/api/chat(/|$) {
        set $upstream_chat http://chat-service:5000;
        proxy_pass $upstream_chat$request_uri;

        # SSE: POST /api/chat/stream emits events incrementally (a fast
        # confirmation event before the slow search). Without these, nginx
        # buffers the whole text/event-stream body and releases it at once,
        # defeating the incremental design (H3). proxy_buffering off streams
        # bytes straight through; gzip off stops re-buffering the stream; the
        # long read timeout keeps a slow turn from being cut mid-stream. All
        # harmless for the other small, non-streamed /api/chat responses.
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300s;
    }
    location ~ ^/api/search(/|$) {
        set $upstream_search http://search-service:5001;
        proxy_pass $upstream_search$request_uri;
    }
    location ~ ^/api/vehicles(/|$) {
        set $upstream_vehicle http://vehicle-service:5002;
        proxy_pass $upstream_vehicle$request_uri;
    }

    # Usage dashboard exposes real spend data - guarded by a shared-secret
    # header the rest of this app doesn't otherwise need (no auth exists
    # anywhere else yet). The placeholder below is substituted with the
    # real secret at container startup by the official nginx image's
    # envsubst-templating mechanism (see docker-compose.yml's nginx
    # service) - this is a deliberate deterrent, not strong security: the
    # frontend that sends this header is a public static bundle, so treat
    # this the same way as a "don't index this page" gate, not a real
    # authorization boundary.
    location ~ ^/api/usage(/|$) {
        if ($http_x_usage_key != "${USAGE_DASHBOARD_KEY}") {
            return 403;
        }
        set $upstream_usage http://search-service:5001;
        proxy_pass $upstream_usage$request_uri;
    }

    # Extension v2 - the wiring-diagram PDFs (docs/Architecture_Extension_v2.md).
    #
    # The files arrived from the client with a .resx extension but are real
    # PDFs (%PDF-1.5), so the type is forced here rather than renaming what
    # was delivered.
    #
    # The id is constrained to digits by the location regex, which is what
    # makes this safe: no traversal, no reaching outside the mounted folder,
    # and nothing to validate in application code. Matching the asset_id
    # column, which only ever holds a numeric RifIDFilePDF.
    #
    # No authentication, consistent with the rest of the app - the mechanic
    # UI has none either. Revisit together with auth, not before.
    location ~ ^/assets/pdf/(?<asset_id>[0-9]+)$ {
        alias /usr/share/semarepair/pdf/$asset_id.resx;
        default_type application/pdf;
        add_header Content-Disposition "inline";
        # Same-origin only: the viewer is our own page, and this stops the
        # file being framed by a third-party site.
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Cache-Control "public, max-age=3600";
    }

    # Extension v2 - les pages du manuel d'atelier scanne.
    #
    # Meme forme que la route PDF ci-dessus, et la meme garantie : l'id est
    # contraint aux chiffres par la location, donc pas de traversee possible
    # et rien a valider cote applicatif. Les ids sont produits par
    # services/ocr-manual (122001..122089), numeriques par construction.
    #
    # Ces images sont la REPONSE, pas une illustration : le texte OCR sert a
    # trouver la page, la page est ce que le mecanicien lit. D'ou le cache
    # long - une page scannee ne change jamais.
    location ~ ^/assets/manual/(?<page_id>[0-9]+)$ {
        alias /usr/share/semarepair/manual/$page_id.jpg;
        default_type image/jpeg;
        add_header Content-Disposition "inline";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Cache-Control "public, max-age=86400";
    }

    # Extension v2 - les photos referencees par les documents.
    #
    # try_files parce que la livraison melange .png et .jpg pour le meme type
    # de ressource : l'id du document ne dit pas l'extension, seul le fichier
    # la connait. =404 en dernier recours, jamais de repli silencieux.
    #
    # Beaucoup de ces references n'ont pas de fichier : 109 des 151 photos que
    # les documents citent n'ont pas ete livrees. Le 404 est donc un cas
    # normal ici, pas une erreur, et le frontend masque l'image plutot que
    # d'afficher une icone cassee.
    location ~ ^/assets/photo/(?<photo_id>[0-9]+)$ {
        root /usr/share/semarepair/photos;
        try_files /$photo_id.png /$photo_id.jpg =404;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend$request_uri;
    }
}
